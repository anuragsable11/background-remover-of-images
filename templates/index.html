<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>AI Background Remover</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="bg-light">
  <nav class="navbar navbar-dark bg-primary shadow-sm">
    <div class="container">
      <a class="navbar-brand fw-bold" href="#">
        <i class="bi bi-magic"></i> BG Remover
      </a>
    </div>
  </nav>

  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-lg-7">
        <div class="card shadow-lg border-0 rounded-4">
          <div class="card-body p-5 text-center">
            <h2 class="fw-bold mb-3">Remove Backgrounds Instantly</h2>
            <p class="text-muted mb-4">Upload any photo and get a clean PNG with a transparent background — powered by AI.</p>

            <!-- Drag & Drop Zone -->
            <div id="dropZone" class="drop-zone p-5 mb-4">
              <i class="bi bi-cloud-upload display-4 text-primary"></i>
              <p class="mt-3 mb-0">Drag & Drop your image here <br>or</p>
              <label class="btn btn-outline-primary mt-2">
                Browse <input type="file" id="imageInput" hidden accept="image/*">
              </label>
            </div>

            <!-- Processing spinner -->
            <div id="progress" class="mb-4 d-none">
              <div class="spinner-border text-primary" role="status"></div>
              <p class="mt-2">Processing your image...</p>
            </div>

            <!-- Preview + Download -->
            <div id="resultArea" class="d-none">
              <h5 class="mb-3">Preview</h5>
              <div class="preview-wrap border rounded p-3 mb-3 bg-white">
                <img id="previewImage" src="#" alt="preview" class="img-fluid rounded">
              </div>
              <a id="downloadLink" class="btn btn-success me-2" href="#" download>
                <i class="bi bi-download"></i> Download PNG
              </a>
              <button type="button" class="btn btn-outline-secondary" id="clearBtn">
                <i class="bi bi-arrow-repeat"></i> Try Another
              </button>
            </div>

            <!-- Error messages -->
            <div id="errorBox" class="alert alert-danger mt-3 d-none"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <footer class="text-center text-muted py-3">
    Made with ❤️ by Anurag | Powered by Flask & Rembg
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
